<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神楽殿 黄金御神籤 ― 豪華絢爛 和風おみくじ ―</title>
  <!-- 格調高い日本語フォントの読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Yuji+Syuku&display=swap" rel="stylesheet">
  <style>
    :root {
      --lacquer-black: #0d0707;
      --deep-crimson: #5c0909;
      --shrine-vermilion: #c9171e;
      --gold-light: #fbe699;
      --gold-main: #d4af37;
      --gold-dark: #997415;
      --washi-bg: #fcf8ef;
      --washi-border: #e6dcc8;
      --ink-black: #1f1a17;
      --font-mincho: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      --font-brush: 'Yuji Syuku', 'Shippori Mincho', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-mincho);
      background: radial-gradient(circle at 50% 25%, #38080a 0%, #170405 60%, #080202 100%);
      color: var(--gold-light);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
    }

    /* 伝統和柄（青海波風）のオーバーレイ */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 100% 150%, transparent 24%, rgba(212, 175, 55, 0.04) 25%, rgba(212, 175, 55, 0.04) 28%, transparent 29%),
        radial-gradient(circle at 0% 150%, transparent 24%, rgba(212, 175, 55, 0.04) 25%, rgba(212, 175, 55, 0.04) 28%, transparent 29%),
        radial-gradient(circle at 50% 100%, transparent 24%, rgba(212, 175, 55, 0.04) 25%, rgba(212, 175, 55, 0.04) 28%, transparent 29%);
      background-size: 60px 30px;
      pointer-events: none;
      z-index: 0;
    }

    /* 背景パーティクルキャンバス（桜・金箔・蛍火） */
    #bgCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* 上部ナビ・音響ボタン */
    .top-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      margin-bottom: 12px;
    }

    .shrine-crest {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      color: var(--gold-main);
    }

    .sound-btn {
      background: rgba(13, 7, 7, 0.75);
      border: 1px solid var(--gold-main);
      color: var(--gold-light);
      padding: 6px 14px;
      border-radius: 999px;
      font-family: var(--font-mincho);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 0.1em;
    }

    .sound-btn:hover {
      background: rgba(212, 175, 55, 0.2);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
    }

    /* タイトルヘッダー */
    header {
      text-align: center;
      z-index: 10;
      margin-bottom: 28px;
      position: relative;
    }

    .sub-heading {
      font-size: 0.85rem;
      letter-spacing: 0.4em;
      color: var(--gold-main);
      margin-bottom: 6px;
    }

    h1 {
      font-family: var(--font-brush);
      font-size: clamp(2rem, 5vw, 3.2rem);
      background: linear-gradient(180deg, #fff6d1 0%, #e5be53 50%, #9e7313 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.8));
      letter-spacing: 0.18em;
      margin-bottom: 8px;
    }

    .divider-ornament {
      width: 240px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-main), transparent);
      margin: 0 auto;
      position: relative;
    }

    .divider-ornament::after {
      content: "◆";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--gold-main);
      font-size: 0.75rem;
      background: #240507;
      padding: 0 8px;
    }

    /* メインステージ（社殿枠） */
    .shrine-stage {
      width: 100%;
      max-width: 780px;
      background: linear-gradient(145deg, rgba(24, 10, 10, 0.92), rgba(12, 5, 5, 0.96));
      border: 2px solid var(--gold-main);
      border-radius: 12px;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.85),
        0 0 30px rgba(212, 175, 55, 0.15),
        inset 0 0 25px rgba(201, 23, 30, 0.2);
      padding: 36px 24px;
      position: relative;
      z-index: 10;
      min-height: 540px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 四隅の金金具（錺金具風装飾） */
    .corner {
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: var(--gold-light);
      border-style: solid;
      pointer-events: none;
    }
    .corner.tl { top: 8px; left: 8px; border-width: 3px 0 0 3px; }
    .corner.tr { top: 8px; right: 8px; border-width: 3px 3px 0 0; }
    .corner.bl { bottom: 8px; left: 8px; border-width: 0 0 3px 3px; }
    .corner.br { bottom: 8px; right: 8px; border-width: 0 3px 3px 0; }

    /* 待機・抽選画面（おみくじ筒エリア） */
    #ritualArea {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
    }

    .cylinder-wrapper {
      position: relative;
      width: 180px;
      height: 260px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 16px 0 28px;
    }

    /* 後光エフェクト */
    .halo-glow {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.35) 0%, rgba(201, 23, 30, 0.1) 50%, transparent 70%);
      animation: pulseGlow 3s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.12); opacity: 1; }
    }

    /* 飛び出す竹串（籤） */
    .bamboo-stick {
      position: absolute;
      top: 15px;
      width: 16px;
      height: 110px;
      background: linear-gradient(90deg, #d8b878, #f5e2b8, #bfa05f);
      border: 1px solid #8c6d32;
      border-radius: 3px 3px 0 0;
      z-index: 2;
      display: flex;
      justify-content: center;
      padding-top: 8px;
      font-family: var(--font-brush);
      color: var(--shrine-vermilion);
      font-size: 0.75rem;
      writing-mode: vertical-rl;
      letter-spacing: 2px;
      transform: translateY(60px);
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.18, 1.25, 0.4, 1);
    }

      opacity:
